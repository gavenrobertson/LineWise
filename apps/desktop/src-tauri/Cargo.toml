[package]
name = "linewise"
version = "0.4.0"
description = "LineWise — open-source network diagramming"
authors = ["Gaven Robertson"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "linewise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# Reads the OS text size (NFR-A11Y-04); already in the tree through Tauri.
windows-registry = "0.6"
