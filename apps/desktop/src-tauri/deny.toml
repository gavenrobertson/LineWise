# SPDX-License-Identifier: Apache-2.0
# cargo-deny configuration (OSS-02, NFR-SEC-08). Run: cargo deny check
[graph]
all-features = false

[advisories]
# Unmaintained-crate notices in the GTK/WebKit stack are informational on Windows/macOS builds.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-3-Clause",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
