name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like LineWise to do?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Some things are out of scope for v1 (docs/SPEC.md section 14), e.g. packet simulation, live device discovery, pushing configs, cloud sync.
      options:
        - label: I checked that this is not on the out-of-scope list.
          required: true
