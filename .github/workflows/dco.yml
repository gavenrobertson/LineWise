# SPDX-License-Identifier: Apache-2.0
# Developer Certificate of Origin (OSS-05): contributors sign off each commit (`git commit -s`).
# Maintainers (owner, members, collaborators) are exempt, like the DCO app's `require.members: false`.
# Branch protection should require this check (docs/HUMAN-TODO.md).
name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every commit is signed off by its author
        if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate | node scripts/dco.mjs
