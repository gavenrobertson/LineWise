# SPDX-License-Identifier: Apache-2.0
# Daily (spec section 11): fuzz tests at 10,000 runs per parser, performance benchmarks with a
# 20% regression gate, dependency audit and CodeQL.
name: nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Record bench/baseline.json from this run (download it from the bench-results artifact and commit it)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz parsers and the file loader (10,000 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fuzz
        env:
          FUZZ_RUNS: '10000'

  bench:
    name: Performance benchmarks (NFR-PERF)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linewise/desktop exec playwright install --with-deps chromium
      - name: Benchmarks, median of 3 runs (NFR targets; fail on > 20% regression against bench/baseline.json)
        env:
          BENCH_RUNS: '3'
          BENCH_MACHINE: github-ubuntu-latest
        run: pnpm bench ${{ inputs.update_baseline && '-- --update-baseline' || '' }}
      - name: Keep the new baseline with the results
        if: always() && inputs.update_baseline
        run: cp bench/baseline.json bench/results/ || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: bench/results
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      # Fails on vulnerabilities; unmaintained or unsound notices are reported as warnings.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
