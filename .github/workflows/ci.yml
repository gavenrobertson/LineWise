# SPDX-License-Identifier: Apache-2.0
# Every PR and push (spec section 11): lint, format, typecheck, clippy, tests with coverage,
# Playwright (Chromium + WebKit), debug Tauri builds on Windows and macOS, tauri-driver smoke.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint, typecheck, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Script and repository-rule tests
        run: pnpm test:scripts
      - name: Traceability matrix and version consistency
        run: |
          pnpm traceability
          pnpm version:check
      - name: Unit, property, golden and component tests with coverage gates
        run: pnpm test:coverage
      - name: Fuzz every parser and the file loader with 10,000 inputs each (NFR-SEC-05)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm fuzz
        env:
          FUZZ_RUNS: '10000'
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage
          retention-days: 14

  licenses:
    name: Dependency licenses and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: License allowlist (npm + cargo, OSS-02)
        run: pnpm licenses:check
      - name: cargo-deny (licenses, bans, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Playwright ${{ matrix.browser }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, browser: chromium }
          - { os: macos-latest, browser: webkit }
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: webkit }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @linewise/desktop exec playwright install --with-deps ${{ matrix.browser }}
      - name: Journeys 1–8
        run: pnpm --filter @linewise/desktop exec playwright test --project ${{ matrix.browser }}
        env:
          CI: '1'
          LINEWISE_NOTICES_NO_CARGO: '1'
      - name: Show failure snapshots
        if: failure()
        shell: bash
        run: find apps/desktop/test-results -name error-context.md -exec sh -c 'echo "::group::$1"; head -c 6000 "$1"; echo "::endgroup::"' _ {} \;
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 14

  rust:
    name: Rust, debug bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      - name: Build the frontend (generates gen/ schemas used by clippy)
        run: pnpm --filter @linewise/desktop build
      - name: rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      # The updater key is a release-only secret, so debug builds skip updater artifacts.
      - name: Debug installers
        run: pnpm --filter @linewise/desktop tauri build --debug --config src-tauri/tauri.debug.conf.json ${{ runner.os == 'Linux' && '--bundles deb' || '' }}
        shell: bash
      - name: tauri-driver smoke test (Windows, Linux)
        if: runner.os != 'macOS'
        timeout-minutes: 15
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Recent WebView2 runtimes ignore the debugging port msedgedriver passes through the
            # environment, so a smoke-only build opens it from its config and the test attaches to
            # it (see smoke.test.mjs). Built after the installers above; nothing from it is shipped.
            pnpm --filter @linewise/desktop tauri build --debug --no-bundle --config src-tauri/tauri.smoke.conf.json
            cargo install --git https://github.com/chippers/msedgedriver-tool
            "$HOME/.cargo/bin/msedgedriver-tool.exe"
            export LINEWISE_SMOKE_ATTACH=9222 LINEWISE_NATIVE_DRIVER="$(cygpath -w "$PWD/msedgedriver.exe")"
            node --test apps/desktop/smoke/smoke.test.mjs
          else
            cargo install tauri-driver --locked
            xvfb-run -a node --test apps/desktop/smoke/smoke.test.mjs
          fi
      - name: Smoke diagnostics (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process linewise, msedgedriver, tauri-driver -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
          Get-Process linewise, msedgedriver, tauri-driver -ErrorAction SilentlyContinue | Stop-Process -Force
          "--- msedgedriver log (filtered) ---"
          Select-String -Path "$env:RUNNER_TEMP\msedgedriver.log" -Pattern 'Launching|user-data|DevTools|WEBVIEW2|webview|error|Error' -ErrorAction SilentlyContinue | Select-Object -First 60 | ForEach-Object Line
          "--- DevToolsActivePort files ---"
          Get-ChildItem -Recurse -Filter DevToolsActivePort "$env:LOCALAPPDATA", "$env:TEMP" -ErrorAction SilentlyContinue | Select-Object FullName, LastWriteTime
          "--- app log ---"
          Get-Content "$env:LOCALAPPDATA\dev.gavenrobertson.linewise\logs\linewise.log" -ErrorAction SilentlyContinue | Select-Object -Last 10
      - uses: actions/upload-artifact@v7
        with:
          name: debug-installers-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/debug/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/debug/bundle/msi/*.msi
            apps/desktop/src-tauri/target/debug/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/debug/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14
